[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protected-cl"
version = "0.1.0"
description = "A reproducible pilot for activation-projected continual learning"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "torch>=2.4", "PyYAML>=6"]

[project.optional-dependencies]
model = ["transformers>=4.51", "accelerate>=1", "safetensors>=0.4"]
test = ["pytest>=8"]
reference = ["peft==0.18.0"]

[tool.setuptools.packages.find]
include = ["pcl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: the full study in miniature (deselect with -m 'not slow')"]
